[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-validation"
version = "0.1.0"
description = "Data validation, MLP training (PyTorch + JAX) and interpretation on an MNIST subset"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["mnist", "mlp", "data-validation", "interpretability", "pytorch", "jax"]

dependencies = [
    # torch 2.2.x is the last release with prebuilt macOS x86_64 (Intel) wheels,
    # and it is incompatible with numpy>=2, so the whole scientific stack is
    # constrained to numpy 1.26. On platforms with newer torch this still resolves
    # to a consistent numpy-1 stack.
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "pyarrow>=15.0",
    "matplotlib>=3.8,<3.10",
    "seaborn>=0.13",
    "scikit-learn>=1.4,<1.6",
    "scipy>=1.11,<1.14",
    "contourpy<1.4",
    "ml-dtypes<0.5",
    # umap-learn>=0.5.7 requires scikit-learn>=1.6 (numpy-2 era); tensorstore>=0.1.75
    # (pulled by flax/orbax) requires ml_dtypes>=0.5. Cap both for the numpy-1 stack.
    "umap-learn>=0.5.5,<0.5.7",
    "tensorstore<0.1.75",
    # Pin numba/llvmlite to versions that ship prebuilt x86_64 macOS wheels
    # (newer llvmlite has no Intel-mac wheel and fails to build from source).
    "numba>=0.61,<0.62",
    "llvmlite>=0.44,<0.45",
    "torch>=2.2,<2.3",
    "jax>=0.4.25,<0.5",
    "jaxlib>=0.4.25,<0.5",
    "flax>=0.8,<0.11",
    "optax>=0.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
]

[project.scripts]
mnist-validation = "mnist_validation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Strict rule set: pycodestyle (E), pyflakes (F), isort (I), pep8-naming (N),
# pyupgrade (UP), bugbear (B), simplify (SIM), annotations (ANN), docstrings (D).
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "D"]
ignore = [
    "ANN401", # allow typing.Any where a framework returns dynamic objects
    "D203",   # incompatible with D211 (no blank line before class docstring)
    "D213",   # incompatible with D212 (multi-line summary on first line)
]

[tool.ruff.lint.per-file-ignores]
# Tests do not require docstrings or full annotation coverage.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "ANN"]
"scripts/*" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src"]

# torch / jax / flax / optax and several scientific libraries ship incomplete or
# dynamic stubs; strict typing against them is counter-productive, so those imports
# are treated as untyped rather than weakening strictness for our own code.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "jax.*",
    "jaxlib.*",
    "flax.*",
    "optax.*",
    "sklearn.*",
    "umap.*",
    "seaborn.*",
    "matplotlib.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
